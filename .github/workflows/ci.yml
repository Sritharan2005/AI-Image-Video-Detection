name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline Unit & API Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev,hf]" -r backend/requirements.txt
      - name: Run Offline Unit & Validation Tests
        run: python -m pytest -q -m "not service and not model"

  check-checkpoint:
    name: Check Model Checkpoint Availability
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Checkpoint and URL
        id: check
        env:
          DEEPGUARD_MODEL_URL: ${{ secrets.DEEPGUARD_MODEL_URL }}
        run: |
          if [ -n "$DEEPGUARD_MODEL_URL" ] || [ -s "backend/models/efficientnet_b0_deepguard.pth" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Model checkpoint source is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Model Tests Skipped::Trained checkpoint (backend/models/efficientnet_b0_deepguard.pth) is absent from repository and DEEPGUARD_MODEL_URL secret is not configured. Model inference and live service integration tests are skipped."
          fi

  model-eval:
    name: Model Inference & Checkpoint Tests
    needs: [test, check-checkpoint]
    if: needs.check-checkpoint.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev,hf]" -r backend/requirements.txt
      - name: Download Model Checkpoint
        env:
          DEEPGUARD_MODEL_URL: ${{ secrets.DEEPGUARD_MODEL_URL }}
        run: |
          mkdir -p backend/models
          if [ ! -s "backend/models/efficientnet_b0_deepguard.pth" ] && [ -n "$DEEPGUARD_MODEL_URL" ]; then
            echo "Downloading checkpoint from DEEPGUARD_MODEL_URL..."
            curl --fail --location --silent --show-error "$DEEPGUARD_MODEL_URL" -o backend/models/efficientnet_b0_deepguard.pth
          fi
          if [ ! -s "backend/models/efficientnet_b0_deepguard.pth" ]; then
            echo "Error: Checkpoint file backend/models/efficientnet_b0_deepguard.pth is missing or empty."
            exit 1
          fi
      - name: Run Model Inference Tests
        run: python -m pytest -q -m model

  integration:
    name: Live Service Integration Tests
    needs: [test, check-checkpoint, model-eval]
    if: needs.check-checkpoint.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev,hf]" -r backend/requirements.txt
      - name: Download Model Checkpoint
        env:
          DEEPGUARD_MODEL_URL: ${{ secrets.DEEPGUARD_MODEL_URL }}
        run: |
          mkdir -p backend/models
          if [ ! -s "backend/models/efficientnet_b0_deepguard.pth" ] && [ -n "$DEEPGUARD_MODEL_URL" ]; then
            echo "Downloading checkpoint from DEEPGUARD_MODEL_URL..."
            curl --fail --location --silent --show-error "$DEEPGUARD_MODEL_URL" -o backend/models/efficientnet_b0_deepguard.pth
          fi
          if [ ! -s "backend/models/efficientnet_b0_deepguard.pth" ]; then
            echo "Error: Checkpoint file backend/models/efficientnet_b0_deepguard.pth is missing or empty."
            exit 1
          fi
      - name: Start services and run integration tests
        run: |

          echo "Starting DeepGuard backend on port 8000..."
          python -m uvicorn app.api:app --app-dir backend --host 127.0.0.1 --port 8000 &
          PID_8000=$!

          echo "Starting Ultra detector backend on port 8005..."
          python -m aidetector.cli api --port 8005 --host 127.0.0.1 --backend ultra &
          PID_8005=$!

          echo "Waiting for services to become healthy..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/status >/dev/null 2>&1 && curl -s http://127.0.0.1:8005/health >/dev/null 2>&1; then
              echo "Both services healthy after ${i}s."
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Error: Services failed to report healthy within 30s."
            kill $PID_8000 $PID_8005 2>/dev/null || true
            exit 1
          fi

          echo "Running live service integration tests..."
          python -m pytest -q -m service

          kill $PID_8000 $PID_8005 2>/dev/null || true
