name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline Unit & API Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev,hf]"
          python -m pip install -r backend/requirements.txt
      - name: Run Offline Unit & API Tests
        run: python -m pytest -q

  integration:
    name: Live Service Integration Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev,hf]"
          python -m pip install -r backend/requirements.txt
      - name: Start services and run integration tests
        run: |
          if [ ! -f "backend/models/efficientnet_b0_deepguard.pth" ]; then
            echo "::warning::Model assets (backend/models/efficientnet_b0_deepguard.pth) not available in CI environment. Live service integration tests require model weights to run."
            echo "Skipping service test execution because required model assets are not present."
            exit 0
          fi

          echo "Starting DeepGuard backend on port 8000..."
          python -m uvicorn app.api:app --app-dir backend --host 127.0.0.1 --port 8000 &
          PID_8000=$!

          echo "Starting Ultra detector backend on port 8005..."
          python -m aidetector.cli api --port 8005 --host 127.0.0.1 --backend ultra &
          PID_8005=$!

          echo "Waiting for services to become healthy..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/status >/dev/null 2>&1 && curl -s http://127.0.0.1:8005/health >/dev/null 2>&1; then
              echo "Both services healthy after ${i}s."
              READY=1
              break
            fi
            sleep 1
          done

          if [ $READY -ne 1 ]; then
            echo "Error: Services failed to report healthy within 30s."
            kill $PID_8000 $PID_8005 2>/dev/null || true
            exit 1
          fi

          echo "Running live service integration tests..."
          python -m pytest -q -m service

          kill $PID_8000 $PID_8005 2>/dev/null || true
